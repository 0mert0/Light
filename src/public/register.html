<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light - Kayıt Ol</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Light'a Hesap Oluştur</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>E-POSTA ADRESİ</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>KULLANICI ADI</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>ŞİFRE</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Kayıt Ol</button>
        </form>
        <div class="link">
            Zaten hesabın var mı? <a href="/">Giriş Yap</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Kayıt başarıyla oluşturuldu! Giriş sayfasına yönlendiriliyorsunuz.');
                    window.location.href = '/';
                } else {
                    alert(data.error || 'Kayıt olurken bir hata oluştu.');
                }
            } catch (err) {
                console.error('Hata:', err);
                alert('Sunucuya bağlanılamadı.');
            }
        });
    </script>

</body>
</html>
