<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light - Giriş Yap</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 380px;
            border: 1px solid #e2e8f0;
        }
        h2 { text-align: center; color: #1e293b; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #64748b; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        .link { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
        .link a { color: #007bff; text-decoration: none; font-weight: 600; }
        .link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Light'a Tekrar Hoş Geldin</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>KULLANICI ADI VEYA E-POSTA</label>
                <input type="text" id="email" required placeholder="E-posta veya kullanıcı adını gir">
            </div>
            <div class="form-group">
                <label>ŞİFRE</label>
                <input type="password" id="password" required placeholder="Şifreni gir">
            </div>
            <button type="submit">Giriş Yap</button>
        </form>
        <div class="link">
            Hesabın yok mu? <a href="register.html">Kayıt Ol</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Kullanıcı bilgilerini localStorage'a kaydediyoruz
                    if (data.user) {
                        localStorage.setItem('light_username', data.user.username);
                        localStorage.setItem('light_tag', data.user.tag);
                    }
                    
                    window.location.href = 'chat.html';
                } else {
                    alert(data.message || 'Giriş yapılırken bir hata oluştu.');
                }
            } catch (err) {
                console.error('Hata:', err);
                alert('Sunucuya bağlanılamadı.');
            }
        });
    </script>

</body>
</html>
