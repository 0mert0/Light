<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light - Giriş Yap</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-card {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 12px;
            width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
        }
        h2 { color: #111827; text-align: center; margin-bottom: 24px; font-size: 22px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; color: #4b5563; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; background-color: #f9fafb; border: 1px solid #d1d5db; border-radius: 6px; color: #1f2937; box-sizing: border-box; outline: none; font-size: 14px; }
        input:focus { border-color: #2563eb; background-color: #ffffff; }
        .btn { width: 100%; background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; font-size: 15px; }
        .btn:hover { background-color: #1d4ed8; }
        .switch-link { text-align: center; margin-top: 20px; font-size: 14px; color: #4b5563; }
        .switch-link a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .switch-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Light'a Tekrar Hoş Geldin</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Kullanıcı Adı veya E-posta</label>
                <input type="text" id="loginIdentifier" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn">Giriş Yap</button>
        </form>
        <div class="switch-link">
            Hesabın yok mu? <a href="/register.html">Kayıt Ol</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const loginIdentifier = document.getElementById('loginIdentifier').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ loginIdentifier, password })
                });
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/chat.html';
                } else {
                    alert(data.message || 'Giriş başarısız!');
                }
            } catch (err) {
                alert('Sunucu hatası oluştu.');
            }
        });
    </script>
</body>
</html>
